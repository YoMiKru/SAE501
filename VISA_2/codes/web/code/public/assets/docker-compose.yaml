services:
  web:
    build: ./web
    ports:
      - "8080:80"

    volumes:
      - ./web/code/public:/var/www/html
      - ./web/code/src:/var/www/src
      - ./logs:/var/www/logs

    depends_on:
      - mariadb

    networks:
      - app_network

  ###########################################
  mariadb:
    build: ./mariadb
    container_name: mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: "05102006"
      MARIADB_DATABASE: "BDD_VISA2"
      MARIADB_USER: "mariadb_user"
      MARIADB_PASSWORD: "05102006"

    volumes:
      # Stockage réel de la base dans le projet
      - ./mariadb/data:/var/lib/mysql

      # Script d'initialisation
      - ./mariadb/23-ProduitsGourmands.sql:/docker-entrypoint-initdb.d/23-ProduitsGourmands.sql:ro

    networks:
      - app_network

networks:
  app_network:
    driver: bridge